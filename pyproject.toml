    "src/ginkgo/runtime/placement.py",
    "src/ginkgo/runtime/scheduler.py",
    "src/ginkgo/runtime/static_directive.py",
    "src/ginkgo/runtime/task_runners/shell.py",
    "src/ginkgo/runtime/task_validation.py",
    "tests/cli/test_cache_explain.py",
    "tests/cli/test_cli.py",
