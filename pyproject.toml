    "plugins/ginkgo-report/src/ginkgo_report/render.py",
    "plugins/ginkgo-report/tests/test_reporting.py",
    "plugins/ginkgo-slack/tests/test_slack_subscriber.py",
    "src/ginkgo/cli/commands/run.py",
    "src/ginkgo/cli/renderers/debug.py",
    "src/ginkgo/cli/renderers/rich.py",
    "src/ginkgo/cli/renderers/run.py",
    "src/ginkgo/core/expr.py",
    "src/ginkgo/core/flow.py",
    "src/ginkgo/core/resources.py",
    "src/ginkgo/core/source_hash.py",
    "src/ginkgo/core/task.py",
