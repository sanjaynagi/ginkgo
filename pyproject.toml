[project]
name = "ginkgo-workflow"
version = "0.4.0"
description = "A dynamic, reproducible workflow orchestrator for scientific and data workflows"
requires-python = ">= 3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "blake3>=1.0.0",
    "numpy>=2.0",
    "ortools>=9.11",
    "pandas>=2.0",
    "pyarrow>=23.0.1,<24",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.optional-dependencies]
# First-party plugins, one extra each. They are released with core at the same
# version, and each plugin pins the exact core version.
aws = ["ginkgo-aws==0.4.0"]
k8s = ["ginkgo-k8s==0.4.0"]
gcp = ["ginkgo-gcp==0.4.0"]
notebook = ["ginkgo-notebook==0.4.0"]
oci = ["ginkgo-oci==0.4.0"]
pixi = ["ginkgo-pixi==0.4.0"]
report = ["ginkgo-report==0.4.0"]
slack = ["ginkgo-slack==0.4.0"]
all = [
    "ginkgo-aws==0.4.0",
    "ginkgo-k8s==0.4.0",
    "ginkgo-gcp==0.4.0",
    "ginkgo-notebook==0.4.0",
    "ginkgo-oci==0.4.0",
    "ginkgo-pixi==0.4.0",
    "ginkgo-report==0.4.0",
    "ginkgo-slack==0.4.0",
]

[project.urls]
Homepage = "https://sanjaynagi.github.io/ginkgo/"
Documentation = "https://sanjaynagi.github.io/ginkgo/docs/"
Repository = "https://github.com/sanjaynagi/ginkgo"
Issues = "https://github.com/sanjaynagi/ginkgo/issues"

[project.scripts]
ginkgo = "ginkgo.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo"]

[tool.hatch.build.targets.sdist]
include = ["src/ginkgo", "README.md", "LICENSE"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
ginkgo-workflow = { path = ".", editable = true }
numpy = ">=2.0"
ortools = ">=9.11"
pandas = ">=2.0"
pyarrow = ">=18.0"
rich = ">=13.9"

[tool.pixi.dependencies]
# Below 3.15 until ortools publishes wheels for it.
python = ">=3.12,<3.15"
pyyaml = ">=6.0"
blake3 = ">=1.0.8,<2"
yaml = ">=0.2.5,<0.3"

# First-party plugins, installed editable from this repository. The default
# environment includes them; the ``core`` environment runs core's tests without
# any plugin installed, which is what proves the boundary.
[tool.pixi.feature.plugins.pypi-dependencies]
ginkgo-aws = { path = "plugins/ginkgo-aws", editable = true }
ginkgo-k8s = { path = "plugins/ginkgo-k8s", editable = true }
ginkgo-gcp = { path = "plugins/ginkgo-gcp", editable = true }
ginkgo-notebook = { path = "plugins/ginkgo-notebook", editable = true }
ginkgo-oci = { path = "plugins/ginkgo-oci", editable = true }
ginkgo-pixi = { path = "plugins/ginkgo-pixi", editable = true }
ginkgo-report = { path = "plugins/ginkgo-report", editable = true }
ginkgo-slack = { path = "plugins/ginkgo-slack", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.0"
# Linters stay at the versions the code is clean under; moving one is its own change.
ruff = ">=0.4,<0.16"
nodejs = ">=22,<23"

[tool.pixi.feature.dev.pypi-dependencies]
pre-commit = ">=4.0"
ty = "<0.0.34"
scikit-learn = ">=1.3"

# Pinned interpreters for the older Pythons ginkgo supports. The default
# environment resolves the newest; CI runs the suite on each of these too.
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = { features = ["dev", "plugins"], solve-group = "default" }
core = { features = ["dev"], solve-group = "default" }
py312 = ["dev", "plugins", "py312"]
py313 = ["dev", "plugins", "py313"]

[tool.pixi.tasks]
test = "pytest tests/ plugins/ -v"
test-core = "pytest tests/ -v"
benchmark = ".pixi/envs/default/bin/python -m benchmarks.run"
lint = "ruff check src/ginkgo/ tests/ benchmarks/ plugins/"
format = "ruff format src/ginkgo/ tests/ benchmarks/ plugins/"
format-check = "ruff format --check src/ginkgo/ tests/ benchmarks/ plugins/"
typecheck = "env -u VIRTUAL_ENV .pixi/envs/default/bin/ty check --python .pixi/envs/default"
precommit = "pre-commit run --all-files"
docs-build = "npm --prefix docs/site ci && npm --prefix docs/site run build"
docs-serve = "npm --prefix docs/site run dev"
docs-clean = "rm -rf docs/site/dist docs/site/.astro"
set-version = "python scripts/version.py set"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that spawn subprocesses or use real network I/O (deselect with -m 'not integration')",
]

[tool.ruff]
src = ["src"]
line-length = 99

[tool.ty.src]
# `pixi run typecheck` checks every file except these, which don't pass ty yet.
# Take a file off the list in the change that makes it pass.
exclude = [
    "benchmarks/fuse_vs_stage/run_bench.py",
    "benchmarks/harness.py",
    "plugins/ginkgo-gcp/tests/test_gcs_store.py",
    "plugins/ginkgo-k8s/tests/test_k8s_executor.py",
    "plugins/ginkgo-notebook/tests/test_notebook_tasks.py",
    "plugins/ginkgo-oci/tests/test_oci_store.py",
