    "src/ginkgo/envs/mounts.py",
    "src/ginkgo/remote/access/mounted.py",
    "src/ginkgo/remote/access/protocol.py",
    "src/ginkgo/remote/access/worker_hydration.py",
    "src/ginkgo/remote/code_bundle.py",
