[project]
name = "ginkgo-pixi"
version = "0.4.0"
description = "Pixi environments for ginkgo tasks, and the ginkgo env command"
requires-python = ">= 3.11"
license = "Apache-2.0"
dependencies = [
    "ginkgo==0.4.0",
]

[project.entry-points."ginkgo.plugins"]
pixi = "ginkgo_pixi:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_pixi"]
