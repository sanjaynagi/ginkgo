[project]
name = "ginkgo-report"
version = "0.1.0"
description = "Static HTML run reports for ginkgo: the ginkgo report command"
requires-python = ">= 3.11"
license = "Apache-2.0"
dependencies = [
    "ginkgo==0.1.0",
    "jinja2>=3.1",
]

[project.entry-points."ginkgo.plugins"]
report = "ginkgo_report:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_report"]
