[project]
name = "ginkgo-aws"
version = "0.4.0"
description = "AWS integrations for ginkgo: the s3:// object store and mountpoint-s3 driver"
requires-python = ">= 3.11"
license = "Apache-2.0"
dependencies = [
    "ginkgo==0.4.0",
    "s3fs>=2024.10.0",
]

[project.entry-points."ginkgo.plugins"]
aws = "ginkgo_aws:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_aws"]
