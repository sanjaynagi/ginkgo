[project]
name = "ginkgo-oci"
version = "0.4.0"
description = "Oracle Cloud integrations for ginkgo: the oci:// object store and rclone driver"
requires-python = ">= 3.11"
license = "Apache-2.0"
dependencies = [
    "ginkgo==0.4.0",
    "ocifs>=1.3.2",
]

[project.entry-points."ginkgo.plugins"]
oci = "ginkgo_oci:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_oci"]
