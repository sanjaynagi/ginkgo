[project]
name = "ginkgo-notebook"
version = "0.4.0"
description = "marimo notebooks as ginkgo tasks"
requires-python = ">= 3.11"
readme = { text = "# ginkgo-notebook\n\nmarimo notebooks as ginkgo tasks.\n\nA plugin for [Ginkgo](https://sanjaynagi.github.io/ginkgo/). Install it with `pip install \"ginkgo-workflow[notebook]\"`, and see the [plugins guide](https://sanjaynagi.github.io/ginkgo/getting-started/installation/#plugins).", content-type = "text/markdown" }
license = "Apache-2.0"
dependencies = [
    "ginkgo-workflow==0.4.0",
    "marimo>=0.23",
]

[project.entry-points."ginkgo.plugins"]
notebook = "ginkgo_notebook:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_notebook"]
