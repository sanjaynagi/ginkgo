[project]
name = "ginkgo-notebook"
version = "0.4.0"
description = "marimo notebooks as ginkgo tasks"
requires-python = ">= 3.11"
license = "Apache-2.0"
dependencies = [
    "ginkgo==0.4.0",
    "marimo>=0.23",
]

[project.entry-points."ginkgo.plugins"]
notebook = "ginkgo_notebook:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_notebook"]
