[project]
name = "ginkgo-k8s"
version = "0.4.0"
description = "Kubernetes executor for ginkgo: run tasks as batch/v1 Jobs"
requires-python = ">= 3.11"
license = "Apache-2.0"
dependencies = [
    "ginkgo==0.4.0",
    "kubernetes>=28.1",
]

[project.entry-points."ginkgo.plugins"]
k8s = "ginkgo_k8s:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_k8s"]
