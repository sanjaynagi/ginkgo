[project]
name = "ginkgo-k8s"
version = "0.4.0"
description = "Kubernetes executor for ginkgo: run tasks as batch/v1 Jobs"
requires-python = ">= 3.12"
readme = { text = "# ginkgo-k8s\n\nKubernetes executor for ginkgo: run tasks as batch/v1 Jobs.\n\nA plugin for [Ginkgo](https://sanjaynagi.github.io/ginkgo/). Install it with `pip install \"ginkgo-workflow[k8s]\"`, and see the [plugins guide](https://sanjaynagi.github.io/ginkgo/getting-started/installation/#plugins).", content-type = "text/markdown" }
license = "Apache-2.0"
dependencies = [
    "ginkgo-workflow==0.4.0",
    # 37.0.2 needs python-dateutil>=3, which the OCI SDK (oci, through ginkgo-oci)
    # caps below 3, so the worker image, which installs both, cannot resolve.
    "kubernetes>=28.1,<37.0.2",
]

[project.entry-points."ginkgo.plugins"]
k8s = "ginkgo_k8s:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_k8s"]
