[project]
name = "ginkgo-gcp"
version = "0.4.0"
description = "Google Cloud integrations for ginkgo: the gs:// object store, gcsfuse driver and GCP Batch executor"
requires-python = ">= 3.11"
readme = { text = "# ginkgo-gcp\n\nGoogle Cloud integrations for ginkgo: the gs:// object store, gcsfuse driver and GCP Batch executor.\n\nA plugin for [Ginkgo](https://sanjaynagi.github.io/ginkgo/). Install it with `pip install \"ginkgo-workflow[gcp]\"`, and see the [plugins guide](https://sanjaynagi.github.io/ginkgo/getting-started/installation/#plugins).", content-type = "text/markdown" }
license = "Apache-2.0"
dependencies = [
    "ginkgo-workflow==0.4.0",
    "gcsfs>=2024.10.0",
    "google-auth>=2.25",
    "google-cloud-batch>=0.17",
    "google-cloud-logging>=3.10",
]

[project.entry-points."ginkgo.plugins"]
gcp = "ginkgo_gcp:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_gcp"]
