[project]
name = "ginkgo-slack"
version = "0.4.0"
description = "Slack run notifications for ginkgo"
requires-python = ">= 3.11"
license = "Apache-2.0"
dependencies = [
    "ginkgo==0.4.0",
]

[project.entry-points."ginkgo.plugins"]
slack = "ginkgo_slack:PLUGIN"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/ginkgo_slack"]
