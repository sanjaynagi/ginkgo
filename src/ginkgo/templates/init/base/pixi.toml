[workspace]
name = "ginkgo-init-template"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# This is the environment the `ginkgo` CLI itself runs from, so every import
# used inside a Python or notebook task body has to be installed here. Python
# tasks cannot declare `env=` — only shell, script, and notebook tasks can —
# so add your analysis libraries to this manifest, not to a task env.
[dependencies]
python = ">=3.12"
numpy = ">=2.0"
pandas = ">=2.0"
marimo = ">=0.23"

# Ginkgo and its plugins are pinned to the release that created this project;
# the plugins pin that exact ginkgo version, so move all three together. To
# upgrade, change the version on every entry and run `pixi install`. Commit
# `pixi.lock`: it records every other resolved dependency. ginkgo-pixi runs the
# tasks that name a Pixi environment with `env=`; ginkgo-notebook runs the
# marimo notebook task.
[pypi-dependencies]
ginkgo-workflow = "=={{ ginkgo_version }}"
ginkgo-pixi = "=={{ ginkgo_version }}"
ginkgo-notebook = "=={{ ginkgo_version }}"

[tasks]
run = "ginkgo run"
check = "ginkgo run --dry-run"
doctor = "ginkgo doctor"
