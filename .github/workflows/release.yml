name: Release

# Pushing a v* tag builds ginkgo-workflow and every first-party plugin and
# publishes them to PyPI. They are released together at the same version, so
# the tag must match every package's version: set them all with
# `pixi run set-version X` before tagging. Each package publishes from an
# environment of its own, pypi-<package>, because PyPI lets only one new
# project register a given repository, workflow and environment as its
# trusted publisher.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check the tag matches every package's version and pin
        run: python3 scripts/version.py check "$GITHUB_REF_NAME"

      - name: Build
        run: |
          uv build --out-dir dist/ginkgo-workflow .
          for plugin in plugins/*/; do uv build --out-dir "dist/$(basename "$plugin")" "$plugin"; done

      - name: Check the distributions
        run: uvx twine check --strict dist/*/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - ginkgo-workflow
          - ginkgo-aws
          - ginkgo-gcp
          - ginkgo-k8s
          - ginkgo-notebook
          - ginkgo-oci
          - ginkgo-pixi
          - ginkgo-report
          - ginkgo-slack
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
