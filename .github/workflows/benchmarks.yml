name: Benchmarks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
          locked: true

      # Task counters are gated on every event. Wall-clock timing is too noisy on
      # shared runners to block pull requests, so --strict is added only elsewhere.
      - name: Run benchmark suite
        env:
          STRICT_TIMING: ${{ github.event_name != 'pull_request' && '--strict' || '' }}
        run: >
          pixi run benchmark --
          --jobs 2
          --cores 2
          --baseline benchmarks/baselines/github-actions-linux.json
          $STRICT_TIMING

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results
