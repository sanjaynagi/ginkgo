# Grants the driver's service account the ginkgo-driver Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ginkgo-driver
  namespace: <namespace>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ginkgo-driver
subjects:
  - kind: ServiceAccount
    name: <service-account>
    namespace: <namespace>
